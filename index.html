<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topup Diamond ML & FF - Terpercaya</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .section-title {
            font-size: 18px;
            margin-bottom: 12px;
            color: #e2e8f0;
            border-left: 4px solid #38bdf8;
            padding-left: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, select:focus {
            border-color: #38bdf8;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
        .payment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .payment-option {
            background: #0f172a;
            border: 2px solid #475569;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            color: #cbd5e1;
        }
        .payment-option input {
            display: none;
        }
        .payment-option.selected, .payment-option:hover {
            border-color: #38bdf8;
            background: #334155;
            color: #fff;
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
        }
        .btn-submit:active {
            transform: scale(0.98);
        }
        .footer-info {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
        .footer-info a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>TOPUP DIAMOND ML & FF</h1>
    <p class="subtitle">Layanan Top Up Game Cepat, Aman, dan Terpercaya</p>

    <form id="topupForm" onsubmit="processCheckout(event)">
        
        <!-- Pilihan Game & ID -->
        <div class="form-group">
            <label for="gameSelect">Pilih Game</label>
            <select id="gameSelect" required onchange="updateDiamondOptions()">
                <option value="" disabled selected>-- Pilih Game --</option>
                <option value="ml">Mobile Legends (ML)</option>
                <option value="ff">Free Fire (FF)</option>
            </select>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="userId">User ID / ID Player</label>
                <input type="text" id="userId" placeholder="Masukkan ID Game Anda" required>
            </div>
            <div class="form-group" id="zoneIdGroup">
                <label for="zoneId">Zone ID (Khusus ML)</label>
                <input type="text" id="zoneId" placeholder="Contoh: (1234)">
            </div>
        </div>

        <!-- Pilihan Nominal Diamond -->
        <div class="form-group">
            <label for="nominalSelect">Pilih Nominal Diamond</label>
            <select id="nominalSelect" required>
                <option value="" disabled selected>-- Pilih game terlebih dahulu --</option>
            </select>
        </div>

        <!-- Metode Pembayaran -->
        <div class="form-group">
            <label>Pilih Metode Pembayaran</label>
            <div class="payment-grid">
                <label class="payment-option" onclick="selectPayment(this)">
                    <input type="radio" name="payment" value="BCA" required> BCA
                </label>
                <label class="payment-option" onclick="selectPayment(this)">
                    <input type="radio" name="payment" value="Mandiri"> Mandiri
                </label>
                <label class="payment-option" onclick="selectPayment(this)">
                    <input type="radio" name="payment" value="BNI"> BNI
                </label>
                <label class="payment-option" onclick="selectPayment(this)">
                    <input type="radio" name="payment" value="DANA"> DANA
                </label>
                <label class="payment-option" onclick="selectPayment(this)">
                    <input type="radio" name="payment" value="OVO"> OVO
                </label>
                <label class="payment-option" onclick="selectPayment(this)">
                    <input type="radio" name="payment" value="GoPay"> GoPay
                </label>
                <label class="payment-option" onclick="selectPayment(this)">
                    <input type="radio" name="payment" value="ShopeePay"> ShopeePay
                </label>
                <label class="payment-option" onclick="selectPayment(this)">
                    <input type="radio" name="payment" value="Alfamart"> Alfamart
                </label>
                <label class="payment-option" onclick="selectPayment(this)">
                    <input type="radio" name="payment" value="Indomaret"> Indomaret
                </label>
            </div>
        </div>

        <!-- Tombol Submit -->
        <button type="submit" class="btn-submit">PROSES PEMBAYARAN</button>
    </form>

    <!-- Informasi Kontak -->
    <div class="footer-info">
        Butuh Bantuan / Kendala? Hubungi WhatsApp kami di: <a href="https://wa.me/6287879491224" target="_blank">087879491224</a>
    </div>
</div>

<script>
    // Data Nominal Diamond berdasarkan game
    const diamondData = {
        ml: [
            { name: "5 Diamond - Rp 1.500", value: "5 Diamond (Rp 1.500)" },
            { name: "50 Diamond - Rp 14.500", value: "50 Diamond (Rp 14.500)" },
            { name: "100 Diamond - Rp 28.000", value: "100 Diamond (Rp 28.000)" },
            { name: "250 Diamond - Rp 70.000", value: "250 Diamond (Rp 70.000)" },
            { name: "500 Diamond - Rp 140.000", value: "500 Diamond (Rp 140.000)" }
        ],
        ff: [
            { name: "50 Diamond - Rp 7.000", value: "50 Diamond (Rp 7.000)" },
            { name: "140 Diamond - Rp 19.000", value: "140 Diamond (Rp 19.000)" },
            { name: "355 Diamond - Rp 48.000", value: "355 Diamond (Rp 48.000)" },
            { name: "720 Diamond - Rp 95.000", value: "720 Diamond (Rp 95.000)" },
            { name: "1450 Diamond - Rp 190.000", value: "1450 Diamond (Rp 190.000)" }
        ]
    };

    function updateDiamondOptions() {
        const game = document.getElementById('gameSelect').value;
        const nominalSelect = document.getElementById('nominalSelect');
        const zoneIdGroup = document.getElementById('zoneIdGroup');
        const zoneIdInput = document.getElementById('zoneId');

        nominalSelect.innerHTML = '<option value="" disabled selected>-- Pilih Nominal Diamond --</option>';
        
        if (game === 'ml') {
            zoneIdGroup.style.display = 'block';
            zoneIdInput.required = true;
            diamondData.ml.forEach(item => {
                let opt = document.createElement('option');
                opt.value = item.value;
                opt.textContent = item.name;
                nominalSelect.appendChild(opt);
            });
        } else if (game === 'ff') {
            zoneIdGroup.style.display = 'none';
            zoneIdInput.required = false;
            zoneIdInput.value = '';
            diamondData.ff.forEach(item => {
                let opt = document.createElement('option');
                opt.value = item.value;
                opt.textContent = item.name;
                nominalSelect.appendChild(opt);
            });
        }
    }

    function selectPayment(element) {
        document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');
        element.querySelector('input').checked = true;
    }

    function processCheckout(event) {
        event.preventDefault();
        
        const game = document.getElementById('gameSelect').value.toUpperCase();
        const userId = document.getElementById('userId').value;
        const zoneId = document.getElementById('zoneId').value;
        const nominal = document.getElementById('nominalSelect').value;
        
        const selectedPayment = document.querySelector('input[name="payment"]:checked');
        
        if (!selectedPayment) {
            alert('Silakan pilih metode pembayaran terlebih dahulu!');
            return;
        }
        
        const paymentMethod = selectedPayment.value;
        
        let detailId = `ID: ${userId}`;
        if (game === 'ML' && zoneId) {
            detailId += ` (${zoneId})`;
        }

        // Contoh aksi: Menampilkan konfirmasi / mengarahkan ke WhatsApp otomatis
        let pesan = `Halo Admin, saya ingin melakukan top up:\n\nGame: Mobile Legends / Free Fire (${game})\nData ${detailId}\nNominal: ${nominal}\nPembayaran via: ${paymentMethod}\n\nMohon diproses ya. Terima kasih!`;
        let encodedPesan = encodeURIComponent(pesan);
        
        // Membuka WhatsApp secara otomatis dengan data pesanan
        window.open(`https://wa.me/6287879491224?text=${encodedPesan}`, '_blank');
    }
</script>

</body>
</html>
